<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marlattice Simulator Wireframe</title>
<!--
  Static wireframe for issue #13. It renders the frame fixtures in
  ../fixtures/ so reviewers can see each UI state. Controls are inert here;
  playback is issue #14.

  Serve the frontend folder so fetch() can read the fixtures:
    python3 -m http.server 8000 -d frontend
  then open http://localhost:8000/design/wireframe.html
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1f2933; --muted: #6b7785;
    --line: #d5dae1; --cell: #fbfcfd; --obstacle: #4b5563;
    --ok: #059669; --warn: #b45309; --bad: #dc2626; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .switcher { display: flex; gap: 6px; align-items: center; padding: 8px 16px;
              background: #fff8e1; border-bottom: 1px dashed #e0c070; font-size: 12px; }
  .switcher button { font: inherit; padding: 3px 10px; border: 1px solid #d8b75a;
                     background: #fff; border-radius: 12px; cursor: pointer; }
  .switcher button[aria-pressed="true"] { background: #f3d77a; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  .badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
           text-transform: uppercase; letter-spacing: .04em; border: 1px solid currentColor; }
  .badge.running { color: var(--accent); } .badge.terminated { color: var(--ok); }
  .badge.truncated { color: var(--warn); } .badge.empty { color: var(--muted); }
  .tick { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .tick strong { font-size: 20px; }
  .bar { width: 140px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px;
         max-width: 1100px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 0 0 8px; }
  .stage { display: flex; justify-content: center; align-items: center; min-height: 420px; }
  .stage svg { width: 100%; max-width: 540px; height: auto; }
  .empty-msg { text-align: center; color: var(--muted); }
  .empty-msg b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  .controls { display: flex; gap: 8px; align-items: center; justify-content: center;
              margin-top: 12px; flex-wrap: wrap; }
  .controls button, .controls select { font: inherit; padding: 6px 14px; border-radius: 6px;
              border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .controls button:disabled { opacity: .4; cursor: not-allowed; }
  .legend { display: grid; grid-template-columns: 28px 1fr; gap: 6px 8px; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 4px; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; color: var(--muted); font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .st-done { color: var(--ok); } .st-blocked { color: var(--bad); font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  aside { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div class="switcher" role="toolbar" aria-label="Wireframe state">
  <span>Wireframe state:</span>
  <button data-state="empty">Empty</button>
  <button data-state="frame_default_reset">Reset (tick 0)</button>
  <button data-state="frame_demo_tick12">Mid-episode</button>
  <button data-state="frame_default_terminated">Terminated</button>
</div>

<header>
  <h1>Marlattice · Warehouse Simulator</h1>
  <span id="badge" class="badge empty">no episode</span>
  <div class="tick" aria-live="polite">
    Tick <strong id="tick">–</strong> <span id="maxSteps">/ –</span>
    <div class="bar"><i id="bar" style="width:0"></i></div>
  </div>
</header>

<main>
  <section class="card">
    <div class="stage" id="stage"></div>
    <div class="controls">
      <button id="btnReset" title="Start a new episode (R)">⟲ Reset</button>
      <button id="btnStep" title="Advance exactly one tick (→)">Step ▸|</button>
      <button id="btnRun" class="primary" title="Run / pause (Space)">▶ Run</button>
      <label>Speed
        <select id="speed"><option>0.5×</option><option selected>1×</option><option>2×</option><option>4×</option></select>
      </label>
    </div>
    <p class="note" id="ctrlNote"></p>
  </section>

  <aside>
    <section class="card">
      <h2>Legend</h2>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card">
      <h2>Robots</h2>
      <table>
        <thead><tr><th>ID</th><th>Pos</th><th>Goal</th><th>Status</th><th>Last</th><th>Rwd</th></tr></thead>
        <tbody id="robots"><tr><td colspan="6" class="note">No episode loaded</td></tr></tbody>
      </table>
    </section>
  </aside>
</main>

<script>
const COLORS = ["#2563eb", "#d97706", "#059669", "#7c3aed", "#db2777"];
const ACTIONS = ["Stay", "Up", "Down", "Left", "Right"];
const DELTA = [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]];
const ARROW = ["·", "↑", "↓", "←", "→"];
const CELL = 48, PAD = 22;
const SVG_NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);

function el(tag, attrs = {}, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

function robotColor(ids, id) { return COLORS[ids.indexOf(id) % COLORS.length]; }
function shortId(id) { return id.replace("robot_", "R"); }

function drawGrid(frame) {
  const { grid_size: n, obstacles, robots } = frame.snapshot;
  const ids = Object.keys(robots);
  const last = frame.last_step;
  const size = PAD + n * CELL;
  const svg = el("svg", { viewBox: `0 0 ${size + 4} ${size + 4}`, role: "img",
                          "aria-label": `Warehouse grid ${n} by ${n}` });
  const cx = c => PAD + c * CELL + CELL / 2, cy = r => PAD + r * CELL + CELL / 2;

  // Coordinate labels: (row, col), origin top-left, per the env contract.
  for (let i = 0; i < n; i++) {
    svg.append(el("text", { x: cx(i), y: 14, "text-anchor": "middle", "font-size": 10, fill: "#6b7785" }, i));
    svg.append(el("text", { x: 10, y: cy(i) + 3, "text-anchor": "middle", "font-size": 10, fill: "#6b7785" }, i));
  }
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    svg.append(el("rect", { x: PAD + c * CELL, y: PAD + r * CELL, width: CELL, height: CELL,
                            fill: "#fbfcfd", stroke: "#d5dae1" }));
  for (const [r, c] of obstacles)
    svg.append(el("rect", { x: PAD + c * CELL + 2, y: PAD + r * CELL + 2, width: CELL - 4, height: CELL - 4,
                            rx: 3, fill: "#4b5563" }));

  // Goals: dashed square in the robot's colour.
  for (const id of ids) {
    const [r, c] = robots[id].goal, col = robotColor(ids, id);
    svg.append(el("rect", { x: PAD + c * CELL + 5, y: PAD + r * CELL + 5, width: CELL - 10, height: CELL - 10,
                            rx: 4, fill: "none", stroke: col, "stroke-width": 2, "stroke-dasharray": "4 3" }));
    svg.append(el("text", { x: PAD + c * CELL + CELL - 8, y: PAD + r * CELL + 14, "text-anchor": "end",
                            "font-size": 9, "font-weight": 700, fill: col }, "G" + shortId(id).slice(1)));
  }

  // Robots: filled circle; check when done; red ring + intended-move arrow when blocked.
  for (const id of ids) {
    const robot = robots[id], [r, c] = robot.position, col = robotColor(ids, id);
    const blocked = last && last.collision_attempt[id];
    if (blocked) {
      const [dr, dc] = DELTA[last.actions[id]];
      // Intended move: dashed red arrow from the ring edge toward the rejected cell.
      const x0 = cx(c) + dc * 21, y0 = cy(r) + dr * 21, x1 = cx(c) + dc * CELL * 0.8, y1 = cy(r) + dr * CELL * 0.8;
      svg.append(el("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: "#dc2626", "stroke-width": 2.5,
                              "stroke-dasharray": "3 2" }));
      svg.append(el("polygon", { fill: "#dc2626", points: [
        [x1 + dc * 6, y1 + dr * 6], [x1 - dr * 5, y1 - dc * 5], [x1 + dr * 5, y1 + dc * 5]
      ].map(p => p.join(",")).join(" ") }));
      svg.append(el("circle", { cx: cx(c), cy: cy(r), r: 19, fill: "none", stroke: "#dc2626", "stroke-width": 3 }));
    }
    svg.append(el("circle", { cx: cx(c), cy: cy(r), r: 15, fill: col }));
    svg.append(el("text", { x: cx(c), y: cy(r) + 4, "text-anchor": "middle", "font-size": 12,
                            "font-weight": 700, fill: "#fff" }, shortId(id)));
    if (robot.reached_goal) {
      svg.append(el("circle", { cx: cx(c) + 12, cy: cy(r) - 12, r: 7, fill: "#059669", stroke: "#fff", "stroke-width": 1.5 }));
      svg.append(el("text", { x: cx(c) + 12, y: cy(r) - 9, "text-anchor": "middle", "font-size": 9,
                              "font-weight": 700, fill: "#fff" }, "✓"));
    }
  }
  return svg;
}

function legendSvg(draw) {
  const svg = el("svg", { width: 28, height: 24, viewBox: "0 0 28 24" });
  draw(svg);
  return svg;
}

function renderLegend() {
  const items = [
    [s => s.append(el("rect", { x: 3, y: 1, width: 22, height: 22, rx: 3, fill: "#4b5563" })), "Obstacle (shelf)"],
    [s => s.append(el("circle", { cx: 14, cy: 12, r: 10, fill: COLORS[0] })), "Robot (colour = ID)"],
    [s => s.append(el("rect", { x: 4, y: 2, width: 20, height: 20, rx: 3, fill: "none", stroke: COLORS[0],
                                "stroke-width": 2, "stroke-dasharray": "4 3" })), "Goal of same-colour robot"],
    [s => { s.append(el("circle", { cx: 12, cy: 13, r: 9, fill: COLORS[2] }));
            s.append(el("circle", { cx: 21, cy: 6, r: 5, fill: "#059669", stroke: "#fff" })); }, "Reached goal (stays put)"],
    [s => { s.append(el("circle", { cx: 14, cy: 12, r: 10, fill: "none", stroke: "#dc2626", "stroke-width": 2.5 }));
            s.append(el("circle", { cx: 14, cy: 12, r: 7, fill: COLORS[1] })); }, "Blocked move last tick (collision_attempt)"],
  ];
  $("legend").replaceChildren(...items.flatMap(([draw, label]) => {
    const span = document.createElement("span"); span.textContent = label;
    return [legendSvg(draw), span];
  }));
}

function renderTable(frame) {
  const tbody = $("robots");
  if (!frame) {
    tbody.innerHTML = '<tr><td colspan="6" class="note">No episode loaded</td></tr>';
    return;
  }
  const { robots } = frame.snapshot, ids = Object.keys(robots), last = frame.last_step;
  tbody.replaceChildren(...ids.map(id => {
    const rb = robots[id], tr = document.createElement("tr");
    const blocked = last && last.collision_attempt[id];
    const status = rb.reached_goal ? ["done", "st-done"] : blocked ? ["blocked", "st-blocked"] : ["moving", ""];
    const cells = [
      `<span class="dot" style="background:${robotColor(ids, id)}"></span>${shortId(id)}`,
      `(${rb.position.join(",")})`, `(${rb.goal.join(",")})`,
      `<span class="${status[1]}">${status[0]}</span>`,
      last ? `<span title="${ACTIONS[last.actions[id]]}">${ARROW[last.actions[id]]}</span>` : "–",
      last ? last.rewards[id].toFixed(2) : "–",
    ];
    tr.innerHTML = cells.map(c => `<td>${c}</td>`).join("");
    return tr;
  }));
}

// Control enablement per state (see design/README.md, "Controls").
function renderControls(frame) {
  const ended = frame && frame.episode_status !== "running";
  $("btnReset").disabled = false;
  $("btnStep").disabled = !frame || ended;
  $("btnRun").disabled = !frame || ended;
  $("ctrlNote").textContent = !frame
    ? "Only Reset is available until an episode exists."
    : ended ? "Episode over: Step and Run are disabled; Reset starts a new episode."
            : "Paused: Step advances exactly one tick. Run plays ticks at the chosen speed.";
}

function renderHeader(frame) {
  const status = frame ? frame.episode_status : "empty";
  $("badge").className = "badge " + status;
  $("badge").textContent = frame ? status : "no episode";
  $("tick").textContent = frame ? frame.snapshot.tick : "–";
  $("maxSteps").textContent = "/ " + (frame ? frame.max_steps : "–");
  $("bar").style.width = frame ? (100 * frame.snapshot.tick / frame.max_steps) + "%" : "0";
}

async function show(state) {
  for (const b of document.querySelectorAll(".switcher button"))
    b.setAttribute("aria-pressed", String(b.dataset.state === state));
  let frame = null;
  if (state !== "empty") {
    try {
      const res = await fetch(`../fixtures/${state}.json`);
      if (!res.ok) throw new Error(res.status);
      frame = await res.json();
    } catch (e) {
      $("stage").innerHTML = `<div class="empty-msg"><b>Could not load fixture</b>
        Serve the frontend folder: <code>python3 -m http.server 8000 -d frontend</code></div>`;
      return;
    }
  }
  $("stage").replaceChildren();
  if (frame) $("stage").append(drawGrid(frame));
  else $("stage").innerHTML = '<div class="empty-msg"><b>No episode loaded</b>Press Reset to start a seeded episode.</div>';
  renderHeader(frame); renderTable(frame); renderControls(frame);
}

renderLegend();
for (const b of document.querySelectorAll(".switcher button"))
  b.addEventListener("click", () => show(b.dataset.state));
show(new URLSearchParams(location.search).get("state") || "frame_demo_tick12");
</script>
</body>
</html>
